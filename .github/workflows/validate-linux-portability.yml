name: Validate released app on Ubuntu 22.04

# A disposable source rebuild, not a publication or a replacement release.
# No caches, artifact uploads, Hosting, privileged token, or package publication.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_SOURCE: a613e93fe74856adcb1b289134e5d8cbb47fbe0c
  ABI_CHECK_SOURCE: 31d4997dca2253f273e377de9a1ec4811af36481
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact released app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ben-milanko/dart-pdf
          ref: ${{ env.APP_SOURCE }}
          path: app-source
          persist-credentials: false
      - name: Check out the proposed Linux packaging guards
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ben-milanko/dart-pdf
          ref: ${{ env.ABI_CHECK_SOURCE }}
          path: abi-check
          persist-credentials: false
      - name: Install Linux build and GUI smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev xvfb x11-utils binutils desktop-file-utils \
            squashfs-tools python3-venv libcurl4-openssl-dev libxml2-dev \
            libyaml-dev libstemmer-dev libsystemd-dev liblzma-dev libzstd-dev \
            gperf gettext xsltproc docbook-xsl itstool
          ldd --version
      - name: Build the schema-aware official AppStream validator
        run: bash abi-check/tool/build_appstream_validator.sh
      - name: Set up the released Flutter compiler without caching
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: false
      - name: Check source identities and test the Linux packaging guards
        run: |
          set -euo pipefail
          test "$(git -C app-source rev-parse HEAD)" = "$APP_SOURCE"
          test "$(git -C abi-check rev-parse HEAD)" = "$ABI_CHECK_SOURCE"
          python3 -m unittest discover -s abi-check/tool -p 'test_linux_*.py' -v
      - name: Resolve released dependencies
        working-directory: app-source
        run: flutter pub get
      - name: Build the released app on the older libc
        working-directory: app-source/app
        run: >-
          flutter build linux --release --build-name=8.0.0 --build-number=44
          --dart-define=PDF_BUILD_COMMIT=${{ env.APP_SOURCE }}
      - name: Check every bundled ELF requirement
        run: python3 abi-check/tool/check_linux_glibc.py app-source/app/build/linux/x64/release/bundle --max-version 2.35
      - name: Check the rebuilt CLI with a public, non-personal PDF
        working-directory: app-source
        run: |
          set -euo pipefail
          build=app/build/linux/x64/release/bundle
          "$build/dartpdf-cli" --version
          echo 'fcee6184c0d776126782cd2799797b106373278c8ea0a4354ee4e33cd8663d51  test_corpora/pdfjs/empty.pdf' | sha256sum -c -
          "$build/dartpdf-cli" inspect test_corpora/pdfjs/empty.pdf --json
      - name: Smoke-test the rebuilt GUI bundle
        working-directory: app-source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          tool/smoke_test_linux_gui.sh \
            --cmd 'app/build/linux/x64/release/bundle/dart_pdf_editor_app' \
            --timeout 15
      - name: Stage the proposed AppImage layout without changing app binaries
        working-directory: app-source/app
        run: |
          set -euo pipefail
          python3 ../../abi-check/tool/stage_linux_appdir.py \
            --bundle build/linux/x64/release/bundle --appdir DartPDF.AppDir
          desktop-file-validate DartPDF.AppDir/dev.milanko.dartpdf.desktop
          appstreamcli validate --no-net DartPDF.AppDir/usr/share/metainfo/dev.milanko.dartpdf.metainfo.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET
          bundle = Path('build/linux/x64/release/bundle')
          appdir = Path('DartPDF.AppDir')
          assert not (appdir / 'usr/bin/share').exists()
          assert (appdir / '.DirIcon').is_file()
          assert [p.name for p in appdir.glob('*.desktop')] == ['dev.milanko.dartpdf.desktop']
          modified = {'share/applications/dev.milanko.dartpdf.desktop',
                      'share/metainfo/dev.milanko.dartpdf.metainfo.xml'}
          checked = 0
          for original in bundle.rglob('*'):
              relative = original.relative_to(bundle)
              if relative.as_posix() in modified:
                  continue
              destination = appdir / 'usr' / relative if relative.parts[0] == 'share' else appdir / 'usr/bin' / relative
              if original.is_symlink():
                  assert destination.is_symlink() and destination.readlink() == original.readlink(), relative
              elif original.is_file():
                  assert hashlib.sha256(original.read_bytes()).digest() == hashlib.sha256(destination.read_bytes()).digest(), relative
                  checked += 1
          component = ET.parse(appdir / 'usr/share/metainfo/dev.milanko.dartpdf.metainfo.xml').getroot()
          assert component.findtext('id') == 'dev.milanko.dartpdf'
          assert component.findtext('launchable') == 'dev.milanko.dartpdf.desktop'
          assert component.find('releases/release').get('version') == '8.0.0'
          assert component.find('screenshots') is None
          print(f'PASS: {checked} unchanged payload files; correct desktop identity and discoverable version-8 AppStream metadata; no Mac marketing media')
          PY
      - name: Package a disposable AppImage with the proposed layout
        working-directory: app-source/app
        run: |
          set -euo pipefail
          APPDIR=DartPDF.AppDir
          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" candidate.AppImage
          sha256sum candidate.AppImage
      - name: Check the packaged AppImage payload and metadata
        working-directory: app-source/app
        run: |
          set -euo pipefail
          ./candidate.AppImage --appimage-extract > extracted-files.txt
          test -f squashfs-root/usr/share/metainfo/dev.milanko.dartpdf.metainfo.xml
          test ! -d squashfs-root/usr/bin/share
          cmp DartPDF.AppDir/usr/share/metainfo/dev.milanko.dartpdf.metainfo.xml squashfs-root/usr/share/metainfo/dev.milanko.dartpdf.metainfo.xml
          cmp DartPDF.AppDir/dev.milanko.dartpdf.desktop squashfs-root/dev.milanko.dartpdf.desktop
          python3 ../../abi-check/tool/check_linux_glibc.py squashfs-root/usr/bin --max-version 2.35
          echo 'PASS: extracted AppImage has discoverable metadata and all binary libc requirements remain within baseline'
      - name: Smoke-test the rebuilt portable GUI
        working-directory: app-source/app
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ../tool/smoke_test_linux_gui.sh \
            --cmd './candidate.AppImage --appimage-extract-and-run' \
            --timeout 15
          echo 'PASS: exact released app source rebuilt with GLIBC <= 2.35, standard AppImage desktop/metadata layout, unchanged payload files, CLI inspection, bundle and AppImage GUI mapped-window smoke tests. No publication or upload.'
